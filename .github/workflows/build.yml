name: Build modded Seerr

# Builds the latest official Seerr release with the "Recently Released"
# Discover sliders patch applied, and publishes it to GitHub Container
# Registry as ghcr.io/<your-github-name>/seerr-mod:latest
#
# Runs when you push to this repo, every Monday morning (to pick up new
# Seerr releases), or on demand from the Actions tab ("Run workflow").

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      seerr_version:
        description: 'Seerr release tag to build (blank = latest release)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (the patch)
        uses: actions/checkout@v4
        with:
          path: mod

      - name: Find Seerr release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.seerr_version }}
        run: |
          if [ -n "$REQUESTED" ]; then TAG="$REQUESTED"; else
            TAG=$(gh api repos/seerr-team/seerr/releases/latest --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building Seerr $TAG with the mod"

      - name: Check out Seerr ${{ steps.ver.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: seerr-team/seerr
          ref: ${{ steps.ver.outputs.tag }}
          path: seerr

      - name: Apply the mod
        working-directory: seerr
        run: |
          git apply --3way ../mod/mod/recent-streaming.patch \
            || git apply ../mod/mod/recent-streaming.patch
          git --no-pager diff --stat

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lower case)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/seerr-mod" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: seerr
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ steps.ver.outputs.tag }}-mod
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
